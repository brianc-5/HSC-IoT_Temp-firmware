# =============================================================================
# RELEASE configuration - minimum sleep current.
#
# Every option here is power-relevant. Anything that keeps a clock, a UART, a
# regulator in LDO mode, or a peripheral biased between bursts costs current, so
# the default posture is "everything off unless the burst needs it".
# Bare-board design target: <=3 uA between bursts. This is not a guaranteed
# complete-board result; Logger HAT V3 standby current remains under study.
# =============================================================================

# --- Bluetooth: broadcaster only -------------------------------------------
# We only advertise (non-connectable). No connections, no scanning, no GATT.
# Leaving out PERIPHERAL/CENTRAL/OBSERVER keeps the link layer and RAM minimal.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n

# The built-in software Controller is selected automatically when CONFIG_BT=y
# on this SoC (CONFIG_BT_CTLR is not a settable symbol on Zephyr 4.x trees).

# Explicit 0 dBm TX power (matches the Arduino/SoftDevice default the bridge is
# tuned for). Higher TX power would raise burst current for no protocol reason.
CONFIG_BT_CTLR_TX_PWR_0=y

# Legacy advertising only - no extended advertising machinery.
CONFIG_BT_EXT_ADV=n

# Device name is never put on-air here (no scan response, no name AD field), but
# a short one keeps the identity/log tidy. Costs nothing on air.
CONFIG_BT_DEVICE_NAME="XIAO Sensor"

# No settings backend: we deliberately do NOT persist the identity to flash.
# The nRF Controller derives a stable static-random address from FICR, which is
# unique per chip and identical across reboots - so the bridge's MAC allowlist
# stays valid without any flash writes. See README "Device MAC".
CONFIG_BT_SETTINGS=n

# --- Power management --------------------------------------------------------
# CONFIG_PM is intentionally NOT set: on nRF52 the idle thread enters System ON
# low power automatically, and the symbol is unavailable on this SoC in newer
# Zephyr trees. Device PM stays on so the QSPI flash and SAADC can be suspended.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_ASYNC=n

# DC/DC note: the former CONFIG_BOARD_ENABLE_DCDC symbol no longer exists; on
# current Zephyr the xiao_ble board enables the DC/DC regulator through its
# devicetree (reg1 regulator-initial-mode). Nothing to set here.

# --- External QSPI NOR flash (P25Q16H) --------------------------------------
# The 2 MB QSPI part idles at hundreds of uA unless it is put into Deep
# Power-Down. Enabling the driver + PM_DEVICE lets us suspend it once at boot;
# the driver issues the DPD command because the DT node carries `has-dpd`
# (see boards/xiao_ble.overlay). CONFIG_FLASH is a hard dependency of the
# QSPI NOR driver on newer trees.
CONFIG_FLASH=y
CONFIG_NORDIC_QSPI_NOR=y

# --- Sensors -----------------------------------------------------------------
# nRF on-die TEMP peripheral via the Zephyr die-temp sensor driver.
# On plain Zephyr + SW controller this is the right driver. On NCS with the
# SoftDevice Controller the TEMP peripheral is owned by MPSL; see README.
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y

# --- ADC (SAADC) for supply voltage -----------------------------------------
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# --- Raw Logger HAT I2C -----------------------------------------------------
# SHT40/BH1750 are deliberately not instantiated as Zephyr sensor devices:
# their shared D10 rail is off at boot and between samples.
CONFIG_I2C=y

# --- GPIO (RGB LEDs inactive + shared Logger HAT enable) ---------------------
CONFIG_GPIO=y

# --- Strip everything that costs idle current or code that we do not use -----
# xiao_ble otherwise defaults to USB CDC ACM as its serial backend. Disable
# that board policy before selecting either a headless release or RTT debug.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_SHELL=n

# Build a UF2 so it can be dropped onto the Adafruit-bootloader mass-storage
# drive (double-tap reset). The board's flash layout is already reserved by the
# upstream xiao_ble board definition for that bootloader.
CONFIG_BUILD_OUTPUT_UF2=y

# No heap / no dynamic allocation in the app.
CONFIG_HEAP_MEM_POOL_SIZE=0
