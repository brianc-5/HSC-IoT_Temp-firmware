# =============================================================================
# DEBUG overlay - adds SEGGER RTT logging on top of prj.conf.
#
#   west build -b xiao_ble -- -DEXTRA_CONF_FILE=debug.conf
#
# NOTE: this overlay RAISES idle current (RTT control block polling, LOG
# processing thread, banner). Use it only on the bench; ship with prj.conf
# alone. UART/serial stays OFF - RTT does not need a UART and keeps the pins
# from drawing current.
# =============================================================================

# Console/logging over SEGGER RTT (J-Link only, no wires beyond SWD).
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Keep log output flowing promptly on a low-traffic device.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
